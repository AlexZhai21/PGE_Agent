[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pge-agent"
version = "0.1.0"
description = "DSS Group 3 local project intake and forecast report prototype"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40,<2", "pydantic>=2.10,<3", "jinja2>=3.1.6,<4", "pypdf>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
pge-agent = "pge_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pge_agent = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
